name: outrun e2e
# Any TesterArmy e2e suite, fanned out over outrun's runners with no configuration (README, "End-to-end
# tests"). Every e2e.config of the checkout is a suite and each of its tests a unit (a serial group is
# one): a unit whose key already passed is replayed, the others are spread over as many runners as the
# wall time aims for, by the per-test durations outrun learned, and their JUnit reports are merged.
#
# The plan job installs nothing when every config was already listed with the same inputs (a kept
# listing, in outrun's cache) and the app is cached. An app the tests drive on a device (an iOS
# simulator `.app`) is built once per run, in the plan job, cached in the fleet's tiers by its inputs'
# content, and installed on a simulator each macOS shard boots; the build's own cache folders
# (`build-cache`) come back from the tiers before a build, so a new key builds incrementally:
#
#       with:
#         runs-on: outrun-macos
#         install: npm ci
#         build: ./scripts/build-simulator-app.sh
#         build-inputs: ios/** package-lock.json
#         build-cache: build/ios ios/Pods
#         app: build/Acme.app
#         filter: --exclude-tag release --exclude-tag push
#         environment: e2e
#
#   jobs:
#     e2e:
#       uses: arkadia-so/outrun/.github/workflows/e2e.yml@v1
#       permissions: { contents: read, id-token: write }
#       with:
#         install: npm ci
#         setup: npx playwright install --with-deps chromium
#         env-secrets: ACME_E2E_TOKEN
#       secrets: inherit
on:
  workflow_call:
    inputs:
      name:
        description: This suite's name in the run's artifacts and report; distinct for each call of this workflow in one run
        type: string
        default: e2e
      runs-on:
        description: The runners' label (outrun-linux-arm64 for web targets, outrun-macos for an iOS simulator)
        type: string
        default: outrun-linux-arm64
      node-version:
        description: The Node e2e's CLI runs on (actions/setup-node; from the runner's tool cache when it has it)
        type: string
        default: "24"
      bun-version:
        description: A Bun for the install and setup commands (oven-sh/setup-bun), when they need one
        type: string
        default: ""
      install:
        description: Installs the repository's dependencies, e2e's CLI among them (run by every job but the report)
        type: string
        required: true
      setup:
        description: What the tests need beyond the dependencies (a browser, an app built for the simulator); run jobs only
        type: string
        default: ""
      build:
        description: Builds the app the tests drive once per run, after `install` (an iOS simulator .app); skipped when its inputs' build is cached or nothing runs
        type: string
        default: ""
      build-inputs:
        description: Globs of the files the build reads, from the repository's root, separated by spaces (`!glob` excludes); its cache key with the command and the runner's image
        type: string
        default: "**"
      build-cache:
        description: Folders the build keeps its own cache in (a framework's build folder), from the root, separated by spaces; restored from the fleet's cache tiers before a build and saved after it, so a new app key builds incrementally
        type: string
        default: ""
      app:
        description: What the build makes (a file or folder, from the repository's root), given to every shard at the same path; an iOS .app is installed on a booted simulator
        type: string
        default: ""
      simulator:
        description: On macOS, with an iOS .app, the simulator a shard boots when none is booted, by name (the newest runtime's first match)
        type: string
        default: iPhone
      env:
        description: Variables for the tests, one NAME=value per line (not secret; outrun keys the tests on them)
        type: string
        default: ""
      env-secrets:
        description: Names of the caller's secrets given to the tests as variables of the same name, separated by spaces
        type: string
        default: ""
      filter:
        description: e2e's selection flags, applied when the tests are listed (a test they leave out is no unit) and in every unit's key, e.g. `--exclude-tag release --tag smoke --grep checkout`; only --tag, --tag-mode, --exclude-tag, --grep, --grep-invert and --target
        type: string
        default: ""
      environment:
        description: The GitHub environment of the jobs that plan, build and run the tests (its secrets, its OIDC subject); none by default
        type: string
        default: ""
      only:
        description: Only the e2e configs whose folder holds or lies under one of these paths, separated by spaces
        type: string
        default: ""
      max-runners:
        description: The most runners one run takes
        type: number
        default: 16
      target:
        description: The wall time to aim for, in seconds, runner start included
        type: number
        default: 300
      timeout-minutes:
        description: Each run job's limit
        type: number
        default: 30

permissions:
  contents: read
  id-token: write # the verdict cache authenticates each job by its OIDC token

env:
  OUTRUN_CACHE_URL: https://cache.outrun.sh

jobs:
  plan:
    runs-on: ${{ inputs.runs-on }}
    # An empty name is no environment.
    environment: ${{ inputs.environment }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      runners: ${{ steps.plan.outputs.runners || steps.listed.outputs.runners }}
      matrix: ${{ steps.plan.outputs.matrix || steps.listed.outputs.matrix }}
      app-key: ${{ steps.app.outputs.key }}
    env:
      APP: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: arkadia-so/outrun@v1.4.0 # this release's own action: package.json's version (release.test.ts)
      # Before planning, even with no install: Node's version is in the tests' keys.
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: Environment
        shell: bash
        env:
          VARIABLES: ${{ inputs.env }}
          NAMES: ${{ inputs.env-secrets }}
          SECRETS: ${{ toJSON(secrets) }}
          FILTER: ${{ inputs.filter }}
        run: |
          outrun e2e-env >>"$GITHUB_ENV"
          case "$FILTER" in *$'\n'*) echo "outrun e2e: the filter input is one line" >&2; exit 1 ;; esac
          echo "OUTRUN_E2E_FILTER=$FILTER" >>"$GITHUB_ENV"
      - id: app
        if: inputs.build != ''
        name: App key
        shell: bash
        env:
          BUILD: ${{ inputs.build }}
          INPUTS: ${{ inputs.build-inputs }}
          CACHE: ${{ inputs.build-cache }}
        run: |
          set -f
          args=()
          for glob in $INPUTS; do args+=(--inputs "$glob"); done
          for path in $CACHE; do args+=(--cache "$path"); done
          key=$(outrun e2e-app-key --build "$BUILD" "${args[@]}")
          echo "OUTRUN_E2E_APP=$key" >>"$GITHUB_ENV"
      # Every config already listed with these inputs: planned with no install.
      - id: plan
        name: Plan (kept listings)
        shell: bash
        env:
          ONLY: ${{ inputs.only }}
        run: |
          only=()
          for path in $ONLY; do only+=(--only "$path"); done
          outrun plan --e2e --cached-listings --out "$RUNNER_TEMP/plan.json" --max-runners ${{ inputs.max-runners }} --target ${{ inputs.target }} "${only[@]}"
      - id: cached
        # Unplanned yet (no kept listing) is no `runners` output: null, which equals '0' in an expression.
        if: inputs.build != '' && (steps.plan.outputs.runners || 'unplanned') != '0'
        name: Cached app
        shell: bash
        run: outrun tier restore "e2e-app-${{ steps.app.outputs.key }}.tar" "$RUNNER_TEMP/app.tar"
      # The install, only to list a config or to build the app.
      - id: need
        name: What this job does
        shell: bash
        env:
          PLANNED: ${{ steps.plan.outputs.planned }}
          BUILD: ${{ inputs.build != '' && (steps.plan.outputs.runners || 'unplanned') != '0' && steps.cached.outputs.hit != 'true' }}
        run: |
          if [ "$PLANNED" = false ] || [ "$BUILD" = true ]; then
            echo "outrun e2e: installing (a listing to make: $([ "$PLANNED" = false ] && echo yes || echo no); the app to build: $BUILD)"
            echo "install=true" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.need.outputs.install == 'true' && inputs.bun-version != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}
      - if: steps.need.outputs.install == 'true'
        name: Install
        shell: bash
        run: ${{ inputs.install }}
      - id: listed
        if: steps.plan.outputs.planned == 'false'
        name: Plan (listed by e2e)
        shell: bash
        env:
          ONLY: ${{ inputs.only }}
        run: |
          only=()
          for path in $ONLY; do only+=(--only "$path"); done
          outrun plan --e2e --out "$RUNNER_TEMP/plan.json" --max-runners ${{ inputs.max-runners }} --target ${{ inputs.target }} "${only[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: outrun-${{ inputs.name }}-plan
          path: ${{ runner.temp }}/plan.json
          retention-days: 1
      # The app, once per run, here rather than in a job of its own (one pickup less): from the
      # fleet's tiers when its key was built before, else built after restoring the build's own cache
      # folders, then saved into this job's tier with them; given to the shards as an artifact too (a
      # shard on another machine may not have the tier's copy yet).
      - id: build
        if: inputs.build != '' && (steps.plan.outputs.runners || steps.listed.outputs.runners) != '0' && steps.cached.outputs.hit != 'true'
        name: Build cache
        shell: bash
        env:
          ENTRY: ${{ steps.app.outputs.cache }}
          CACHE: ${{ inputs.build-cache }}
        run: |
          [ -n "$ENTRY" ] || exit 0
          outrun tier restore "$ENTRY" "$RUNNER_TEMP/build-cache.tar"
          if [ -f "$RUNNER_TEMP/build-cache.tar" ]; then
            tar -xf "$RUNNER_TEMP/build-cache.tar" && rm "$RUNNER_TEMP/build-cache.tar"
            echo "outrun e2e: the build's cache restored: $CACHE"
          fi
      - if: steps.build.outcome == 'success'
        name: Build
        shell: bash
        run: ${{ inputs.build }}
      - if: steps.build.outcome == 'success'
        name: Save
        shell: bash
        env:
          ENTRY: ${{ steps.app.outputs.cache }}
          CACHE: ${{ inputs.build-cache }}
        run: |
          [ -e "$APP" ] || { echo "outrun e2e: the build made no $APP (the app input)" >&2; exit 1; }
          tar -C "$(dirname "$APP")" -cf "$RUNNER_TEMP/app.tar" "$(basename "$APP")"
          outrun tier save "$RUNNER_TEMP/app.tar" "e2e-app-${{ steps.app.outputs.key }}.tar"
          [ -n "$ENTRY" ] || exit 0
          set -f
          paths=()
          for path in $CACHE; do [ -e "$path" ] && paths+=("$path"); done
          [ ${#paths[@]} -gt 0 ] || exit 0
          tar -cf "$RUNNER_TEMP/build-cache.tar" "${paths[@]}"
          outrun tier save "$RUNNER_TEMP/build-cache.tar" "$ENTRY"
      - if: inputs.build != '' && (steps.plan.outputs.runners || steps.listed.outputs.runners) != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: outrun-${{ inputs.name }}-app
          path: ${{ runner.temp }}/app.tar
          retention-days: 1
          compression-level: 0

  run:
    needs: plan
    if: needs.plan.outputs.runners != '0'
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: arkadia-so/outrun@v1.4.0 # this release's own action: package.json's version (release.test.ts)
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - if: runner.os == 'macOS' && endsWith(inputs.app, '.app')
        name: Simulator
        shell: bash
        env:
          SIMULATOR: ${{ inputs.simulator }}
        run: |
          # The booted iOS simulators (e2e's mobile driver uses those), else the newest runtime's first
          # device named like SIMULATOR, booted now so that it boots while the job installs; the App
          # step installs the app on each.
          booted=$(xcrun simctl list devices booted -j | jq -r '.devices | to_entries[] | select(.key | test("iOS")) | .value[].udid')
          if [ -z "$booted" ]; then
            booted=$(xcrun simctl list devices available -j | jq -r --arg name "$SIMULATOR" '[.devices | to_entries[] | select(.key | test("iOS"))] | sort_by(.key | capture("iOS-(?<v>[0-9-]+)").v | split("-") | map(tonumber)) | reverse | map(.value[] | select(.name | contains($name))) | first | .udid // empty')
            [ -n "$booted" ] || { echo "outrun e2e: no iOS simulator named like '$SIMULATOR' on this runner" >&2; exit 1; }
            xcrun simctl boot "$booted"
          fi
          echo "OUTRUN_SIMULATORS=$(echo "$booted" | tr '\n' ' ')" >>"$GITHUB_ENV"
      - if: inputs.bun-version != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}
      - name: Environment
        shell: bash
        env:
          VARIABLES: ${{ inputs.env }}
          NAMES: ${{ inputs.env-secrets }}
          SECRETS: ${{ toJSON(secrets) }}
          FILTER: ${{ inputs.filter }}
        run: |
          outrun e2e-env >>"$GITHUB_ENV"
          case "$FILTER" in *$'\n'*) echo "outrun e2e: the filter input is one line" >&2; exit 1 ;; esac
          echo "OUTRUN_E2E_FILTER=$FILTER" >>"$GITHUB_ENV"
      - name: Install
        shell: bash
        run: ${{ inputs.install }}
      - name: Setup
        if: inputs.setup != ''
        shell: bash
        run: ${{ inputs.setup }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: outrun-${{ inputs.name }}-plan
          path: ${{ runner.temp }}/plan
      - id: app
        if: inputs.build != ''
        name: Cached app
        shell: bash
        env:
          KEY: ${{ needs.plan.outputs.app-key }}
        run: |
          echo "OUTRUN_E2E_APP=$KEY" >>"$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/app"
          outrun tier restore "e2e-app-$KEY.tar" "$RUNNER_TEMP/app/app.tar"
      - if: inputs.build != '' && steps.app.outputs.hit != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: outrun-${{ inputs.name }}-app
          path: ${{ runner.temp }}/app
      - if: inputs.build != ''
        name: App
        shell: bash
        env:
          APP: ${{ inputs.app }}
        run: |
          mkdir -p "$(dirname "$APP")"
          rm -rf "$APP"
          tar -C "$(dirname "$APP")" -xf "$RUNNER_TEMP/app/app.tar"
          [ -n "${OUTRUN_SIMULATORS:-}" ] || exit 0
          for udid in $OUTRUN_SIMULATORS; do
            xcrun simctl bootstatus "$udid" -b >/dev/null
            xcrun simctl install "$udid" "$APP"
            echo "outrun e2e: $APP installed on simulator $udid"
          done
      - if: env.OUTRUN_SIMULATORS != ''
        name: XCTest runner
        id: runner
        shell: bash
        run: |
          # e2e's iOS driver builds an XCTest runner on its first run (~40 s); it reuses a restored one
          # only when its own manifest matches, so the entry is keyed on the driver and Xcode.
          driver=$(find . -path '*/node_modules/agent-device/package.json' -not -path '*/node_modules/*/node_modules/*' | sort | head -1)
          [ -n "$driver" ] || exit 0
          key=$({ jq -r .version "$driver"; xcodebuild -version; sw_vers -productVersion; uname -m; } | shasum -a 256 | cut -c1-32)
          entry="e2e-ios-runner-$key.tar"
          echo "entry=$entry" >>"$GITHUB_OUTPUT"
          outrun tier restore "$entry" "$RUNNER_TEMP/runner.tar"
          if [ -f "$RUNNER_TEMP/runner.tar" ]; then
            mkdir -p "$HOME/.agent-device/apple-runner" && tar -C "$HOME/.agent-device/apple-runner" -xf "$RUNNER_TEMP/runner.tar"
          fi
      - name: e2e
        shell: bash
        env:
          ONLY: ${{ inputs.only }}
        run: |
          only=()
          for path in $ONLY; do only+=(--only "$path"); done
          outrun test --e2e --plan "$RUNNER_TEMP/plan/plan.json" --shard ${{ matrix.shard }}/${{ needs.plan.outputs.runners }} "${only[@]}"
      - if: steps.runner.outputs.hit == 'false'
        name: Save the XCTest runner
        shell: bash
        env:
          ENTRY: ${{ steps.runner.outputs.entry }}
        run: |
          [ -d "$HOME/.agent-device/apple-runner/derived" ] || exit 0
          tar -C "$HOME/.agent-device/apple-runner" -cf "$RUNNER_TEMP/runner.tar" derived
          outrun tier save "$RUNNER_TEMP/runner.tar" "$ENTRY"
      # The batches' reports, gathered from the configs' folders git knows: a `**` glob would walk
      # node_modules (~12 s on a shard).
      - if: always()
        name: Reports
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          git ls-files -z -- '*e2e.config.ts' '*e2e.config.mts' '*e2e.config.js' '*e2e.config.mjs' | while IFS= read -r -d '' config; do
            dir=$(dirname "$config")
            for report in "$dir"/.e2e/outrun-*; do
              [ -d "$report" ] || continue
              mkdir -p "$RUNNER_TEMP/reports/$dir" && cp -R "$report" "$RUNNER_TEMP/reports/$dir/"
            done
          done
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: outrun-${{ inputs.name }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/reports
          if-no-files-found: ignore
          retention-days: 7

  report:
    needs: [plan, run]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.runners != '0'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    steps:
      - uses: arkadia-so/outrun@v1.4.0 # this release's own action: package.json's version (release.test.ts)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: outrun-${{ inputs.name }}-shard-*
          path: ${{ runner.temp }}/shards
      - name: Merge
        shell: bash
        run: |
          # macOS's bash 3.2 has no mapfile.
          reports=()
          if [ -d "$RUNNER_TEMP/shards" ]; then
            while IFS= read -r report; do reports+=("$report"); done < <(find "$RUNNER_TEMP/shards" -name junit.xml | sort)
          fi
          outrun junit-merge --name "${{ github.repository }} ${{ inputs.name }}" --out "$RUNNER_TEMP/e2e-junit.xml" "${reports[@]}" >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: outrun-${{ inputs.name }}-report
          path: ${{ runner.temp }}/e2e-junit.xml
          retention-days: 30
      - name: Verdict
        if: needs.run.result != 'success'
        shell: bash
        run: |
          echo "outrun e2e: a shard failed (${{ needs.run.result }})" >&2
          exit 1
